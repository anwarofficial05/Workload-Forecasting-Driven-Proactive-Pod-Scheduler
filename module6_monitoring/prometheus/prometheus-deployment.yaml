apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: proactive-system
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
    scrape_configs:
      - job_name: "prometheus"
        static_configs:
          - targets: ["localhost:9090"]
      - job_name: "demo-application"
        scrape_interval: 3s
        static_configs:
          - targets: ["workload-demo-app:8080"]
      - job_name: "forecast-service"
        scrape_interval: 3s
        static_configs:
          - targets: ["forecast-service:8000", "forecast-service:8001"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: proactive-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.49.1
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus/"
            - "--web.enable-lifecycle"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config-volume
              mountPath: /etc/prometheus
      volumes:
        - name: config-volume
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: proactive-system
spec:
  type: ClusterIP
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
