global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "demo-application"
    scrape_interval: 3s
    static_configs:
      - targets: ["workload-demo-app.proactive-system.svc.cluster.local:8080"]

  - job_name: "forecast-service"
    scrape_interval: 3s
    static_configs:
      - targets:
          - "forecast-service.proactive-system.svc.cluster.local:8000"
          - "forecast-service.proactive-system.svc.cluster.local:8001"

  - job_name: "kubernetes-nodes"
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      insecure_skip_verify: true
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
