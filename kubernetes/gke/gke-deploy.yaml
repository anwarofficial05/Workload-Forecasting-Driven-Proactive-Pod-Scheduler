apiVersion: v1
kind: Namespace
metadata:
  name: proactive-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: proactive-scheduler-sa
  namespace: proactive-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: proactive-scheduler-role
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "update"]
  - apiGroups: [""]
    resources: ["pods/binding", "bindings"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: proactive-scheduler-binding
subjects:
  - kind: ServiceAccount
    name: proactive-scheduler-sa
    namespace: proactive-system
roleRef:
  kind: ClusterRole
  name: proactive-scheduler-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workload-demo-app
  namespace: proactive-system
spec:
  replicas: 3
  selector:
    matchLabels:
      app: workload-demo-app
  template:
    metadata:
      labels:
        app: workload-demo-app
    spec:
      schedulerName: proactive-scheduler
      containers:
        - name: demo-app
          image: gcr.io/google-samples/gb-frontend:v4
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
---
apiVersion: v1
kind: Service
metadata:
  name: workload-demo-app-lb
  namespace: proactive-system
spec:
  type: LoadBalancer
  selector:
    app: workload-demo-app
  ports:
    - port: 80
      targetPort: 80
